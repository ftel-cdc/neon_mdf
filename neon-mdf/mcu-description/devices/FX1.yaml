            description: Number of complete READY banks, 0..2.
          - name: LEASED
            bit_offset: 2
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 1 when software holds a result bank.
          - name: READ_VALID
            bit_offset: 3
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Equals LEASED; result reads return zero when clear.
          - name: READ_BANK
            bit_offset: 4
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Index of leased result bank; zero without a lease.
          - name: WRITE_BUSY
            bit_offset: 5
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 1 while a bank is WRITING, including final accumulation drain.
          - name: OVERRUN
            bit_offset: 6
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Sticky report for bank exhaustion, illegal geometry or ingress-context overflow. No new interrupt;
              clear with CLEAR_REPORT.
          - name: READ_NUM_ZONE_X
