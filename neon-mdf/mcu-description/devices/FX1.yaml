            bit_offset: 1
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Derivation or validation is pending.
          - name: ERROR
            bit_offset: 4
            bit_width: 4
            access: ro
            reset: 0x00000000
            description: 'Priority code: 0 none; 1 input format/active size; 2 crop empty/out of bounds; 3 odd crop
              geometry; 4 reserved resize mode; 5 target exceeds channel limit; 6 target exceeds crop. Lowest applicable
              nonzero code wins. BUSY implies VALID=0 and ERROR=0.'
