      - name: LSC_CTRL
        offset: 0x00000400
        size: 32
        access: rw
        reset: 0x00000000
        description: 'LSC: lens shading correction control.

          Multiplies each Bayer sample by a gain interpolated from a mesh, correcting the lens''s corner falloff.'
        fields:
          - name: EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Lens Shading Correction Enable

              1 = apply the mesh gains, 0 = pass through unchanged.

              Has no effect unless a profile has been loaded and validated -- see LSC_PROFILE_STATUS.'
      - name: LSC_MESH_NODES
        offset: 0x00000404
        size: 32
        access: rw
        reset: 0x00000000
        description: 'LSC: mesh geometry, shared by all profiles.

          The reset value of zero is deliberately invalid: a mesh must be described before it can be loaded, and zero
          nodes cannot be. Global mesh shape, outside TUNE_BANK. Change only after full drain, leaving profile mode
          and releasing all sealed resident pins; invalidates mesh confirmations.'
        fields:
          - name: MESH_NX
            bit_offset: 0
            bit_width: 8
            access: rw
            reset: 0x00000000
            description: 'Mesh Horizontal Node Count

              Legal range 2..32, not exceeding active image width. Cells partition width-1 across nx-1 intervals;
              integer spacing may differ by one sample. Geometry changes invalidate resident profiles.'
          - name: MESH_NY
            bit_offset: 8
            bit_width: 8
            access: rw
            reset: 0x00000000
            description: 'Mesh Vertical Node Count

              Legal range 2..32, not exceeding active image height. Cells partition height-1 across ny-1 intervals;
              integer spacing may differ by one line.'
      - name: LSC_STRENGTH
        offset: 0x00000408
        size: 32
        access: rw
        reset: 0x00000000
        description: 'LSC: how much of the mesh correction to apply.

          Blends between no correction and the full mesh, so one calibration can be backed off without reloading it.'
        fields:
          - name: STRENGTH
            bit_offset: 0
            bit_width: 17
            access: rw
            reset: 0x00000000
            description: 'Correction Strength

              UQ1.16. Legal range 0..0x10000: zero gives unity and 0x10000 applies the full mesh. Larger representable
              codes extrapolate correction; negative effective gain clamps the pixel to zero.'
      - name: LSC_PROFILE_SEL
        offset: 0x0000040C
        size: 32
        access: rw
        reset: 0x00000000
        description: 'LSC: which resident profile the pipeline uses.

          Three profiles are held so a different illuminant can be selected without a reload. Legacy mode: selecting
          an unloaded profile is refused and sets LSC_ERROR.profile_sel_reject. Profile mode: a bank scalar stored
          without check; SEAL rejects code 3 (INVALID) or an enabled selection of an invalid resident (NOT_READY).'
        fields:
          - name: PROFILE_SEL
            bit_offset: 0
            bit_width: 2
            access: rw
            reset: 0x00000000
            description: 'Active Profile Select

              0..2. Code 3 is invalid: rejected at the write in legacy mode, rejected by SEAL in profile mode.'
      - name: LSC_LOAD_CTRL
        offset: 0x00000410
        size: 32
        access: mixed
        reset: 0x00000000
        description: 'LSC: sequential mesh loading into an inactive profile. Issue LOAD_BEGIN, write exactly 4*nx*ny
          coefficients, then LOAD_VALIDATE. Command priority is ABORT, VALIDATE, BEGIN. Begin while busy or validate
          while idle sets LOAD_PROTOCOL. Profile mode additionally sets TUNE_ERROR.LOCKED for every rejected destination
          (sealed, pending or in-flight); an in-flight destination sets both LOCKED and ACTIVE_LOAD_REJECT.'
        fields:
          - name: LOAD_PROFILE
            bit_offset: 0
            bit_width: 2
            access: rw
            reset: 0x00000000
            description: 'Load Destination Profile

              Destination profile for the load, 0..2.

              Loading the active profile is refused with ACTIVE_LOAD_REJECT. Active means selected by an admitted,
              unretired frame with LSC enabled, or in legacy mode the LSC_PROFILE_SEL profile while LSC_CTRL.EN=1
              and ACTIVE_VALID=1. After reset no profile is active.'
          - name: LOAD_BEGIN
            bit_offset: 8
            bit_width: 1
            access: w1s
            reset: 0x00000000
            description: 'Begin Coefficient Load

              Write 1 to start a load; self-clearing.'
          - name: LOAD_VALIDATE
            bit_offset: 9
            bit_width: 1
            access: w1s
            reset: 0x00000000
            description: 'Validate Coefficient Load

              Write 1 to finish a load; self-clearing.

              Checks the coefficient count and marks the profile valid only if it matches.'
          - name: LOAD_ABORT
            bit_offset: 10
            bit_width: 1
            access: w1s
            reset: 0x00000000
            description: 'Abort Coefficient Load

              Write 1 to discard the partial load and return to idle; self-clearing. The destination remains invalid
              until reloaded and validated. The active profile is unchanged.'
      - name: LSC_COEF_DATA
        offset: 0x00000414
        size: 32
        access: rw
        reset: 0x00000000
        description: Node gain UQ4.18 [21:0]; unity 0x40000, maximum 8x (0x200000), ISP-UPD-001.
        fields:
          - name: COEF_DATA
            bit_offset: 0
            bit_width: 22
            access: rw
            reset: 0x00000000
            description: Node gain UQ4.18 [21:0]; unity 0x40000, maximum 8x (0x200000), ISP-UPD-001.
      - name: LSC_LOAD_STATUS
        offset: 0x00000418
        size: 32
        access: ro
        reset: 0x00000000
        description: 'LSC: progress of a load in flight, read-only.'
        fields:
          - name: LOAD_ADDR
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
            description: 'Coefficients Accepted

              Number of coefficients accepted so far in this load.'
          - name: LOAD_FULL
            bit_offset: 16
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'Load Complete

              1 = the expected 4*nx*ny coefficients have been written.'
          - name: LOAD_BUSY
            bit_offset: 17
            bit_width: 1
            access: ro
            reset: 0x00000000
