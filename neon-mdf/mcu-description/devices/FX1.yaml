            bit_offset: 2
            bit_width: 1
            access: w1c
            reset: 0x00000000
            description: 'Coefficient Out Of Range

              A written coefficient exceeded the legal gain range 0..4 inclusive in UQ3.18, or LOAD_VALIDATE found
              such a coefficient in the load. The load stays invalid until the next LOAD_BEGIN or LOAD_ABORT; clearing
              this bit does not make it valid. Sticky W1C; a simultaneous new error wins over clear.'
          - name: COEF_COUNT
            bit_offset: 3
            bit_width: 1
            access: w1c
            reset: 0x00000000
