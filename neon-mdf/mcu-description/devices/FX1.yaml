              down.'
      - name: DMA_CTRL
        offset: 0x00003000
        size: 32
        access: mixed
        reset: 0x00003F00
        description: 'DMA Engine: control at byte offset 0x3000. Configure and enable the pixel pipeline before arming/enabling
          DMA so output geometry is valid. DMA and CSR transactions are independent.'
        fields:
          - name: IDMA_EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Input DMA Enable

              1 = the input DMA fetches frames from DDR.'
          - name: ODMA_EN
            bit_offset: 1
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Output DMA Enable

              1 = the output DMA writes frames to DDR.'
          - name: SOFT_RESET
            bit_offset: 2
            bit_width: 1
            access: w1sc
            reset: 0x00000000
            description: 'DMA Soft Reset

              Request DMA-scope group recovery: stop admission, drain both AXI masters, held requests and internal
              consumers, then 15-clock internal reset pulse; reads zero. Preserves CSR configuration, the sealed active
              profile, completed READY/LEASED statistics and the DONE bits and metadata of outputs completed before
              the request. Preserves DMA_ERR and DMA_IRQ_STAT. Clears VALID/FREE ownership and restarts every rotation
              at buffer 0. Poll COMMON_RECOVERY_STATUS.BUSY/DONE; copy abort records before restart. Busy requests
              rejected with TUNE_ERROR.PENDING. COMMON_CTRL.SOFT_RST has the broader pipeline/result reset scope.'
          - name: MAX_BURST_M1
            bit_offset: 8
            bit_width: 8
            access: rw
            reset: 0x0000003F
            description: 'Maximum AXI Burst Length Minus One

              Encoded value 0..255 gives 1..256 beats. Reset 63 gives 64 beats. MAX_BURST_BEATS in the MAS is the
              effective value MAX_BURST_M1+1; bursts also split at line and 4 KiB boundaries.'
