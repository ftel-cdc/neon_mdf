              until RELEASE; no lease returns zero and sets the ownership error.
      - name: AWB_RESULT_CTRL
        offset: 0x00002468
        size: 32
        access: w1p
        reset: 0x00000000
        description: 'AWB: one-clock write-one ownership/report commands, qualified by byte strobes. Reads return
          zero; reserved bits are ignored. RELEASE wins over simultaneous ACQUIRE. New loss events win over CLEAR_REPORT.'
        fields:
          - name: ACQUIRE
            bit_offset: 0
            bit_width: 1
            access: w1p
            reset: 0x00000000
            description: Acquire the oldest READY bank for software readout. One-clock command; reads zero. No effect
              if no READY result or a lease already exists. Confirm READ_VALID before reading; allow one clock before
              zone reads.
          - name: RELEASE
            bit_offset: 1
            bit_width: 1
            access: w1p
            reset: 0x00000000
            description: Release the LEASED bank to FREE. One-clock command; reads zero. No effect without a lease.
              A released bank is eligible for admission on the following edge.
          - name: CLEAR_REPORT
            bit_offset: 2
            bit_width: 1
            access: w1p
            reset: 0x00000000
            description: Clear OVERRUN and DROP_COUNT only. One-clock command; reads zero. Does not release results
              or clear STAT_DONE. A simultaneous new loss sets OVERRUN and increments the cleared count.
      - name: AWB_RESULT_STATUS
        offset: 0x0000246C
        size: 32
        access: ro
        reset: 0x00000000
        description: 'AWB: ownership status. Two result banks; at most one lease. Ready/leased banks are immutable.
          All reserved bits read zero.'
        fields:
          - name: READY_COUNT
            bit_offset: 0
