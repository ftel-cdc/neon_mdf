            description: Lane 3 in Stop State.
          - name: LANE3_SOT_ERROR
            bit_offset: 25
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Lane 3 errsoths seen (sticky).
          - name: LANE3_SOT_SYNC_ERROR
            bit_offset: 26
            bit_width: 1
            access: ro
