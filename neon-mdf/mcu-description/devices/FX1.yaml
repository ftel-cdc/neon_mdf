  - name: MIPI_CSI2
    base: 0x11040000
    description: 'MIPI CSI-2 RX Controller (FTEL MAS v1.4 / HAS v1.2, CSR v1.4). Chỉ có khi VP bật --camera. Base là placeholder VP; 4 KiB aperture, giải mã 0x00-0xFF, 0x100-0xFFF trả DECERR. Lệch so với VP fx1_csi2_regs.h (workbook cũ): IP_VERSION, STREAM_CONFIG reset/bit2, BUFFER_STATUS bit19, DMA_ATTR reset, META_AREA_SIZE, TPG_CONTROL[5:4].'
    registers:
      - name: IP_VERSION
        offset: 0x00000000
        size: 32
        access: ro
        reset: 0x00010200
        description: 'IP identifier and version: major [31:16], minor [15:8], patch [7:0].'
        fields:
          - name: IP_VERSION
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00010200
            description: 0x0001_0200 = v1.2.0 (MAS v1.4 param IP_VERSION).
      - name: CORE_CONFIG
        offset: 0x00000004
        size: 32
        access: mixed
        reset: 0x00000001
        description: Core control.
        fields:
          - name: CORE_ENABLE
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000001
            description: 'Global core enable. Low: Packet FSM idle, per-VC context cleared, open captures dropped.'
          - name: SOFT_RESET
            bit_offset: 1
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Level datapath reset, config preserved. Needs running rxbyteclkhs to reach Lane Mgmt.
          - name: FULL_RESET
            bit_offset: 2
            bit_width: 1
            access: wo
            reset: 0x00000000
            description: Self-clearing. Resets D-PHY + datapath + register file via PHY Reset Sequencer.
      - name: PROTOCOL_CONFIG
        offset: 0x00000008
        size: 32
        access: mixed
        reset: 0x00000003
        description: Protocol configuration.
        fields:
          - name: ACTIVE_LANES
            bit_offset: 0
            bit_width: 2
            access: rw
            reset: 0x00000003
            description: 00=1 lane, 01=2 lanes, 11=4 lanes, 10 reserved. Adopted only in Lane Mgmt ST_IDLE.
          - name: MAX_LANES
            bit_offset: 8
            bit_width: 2
            access: ro
            reset: 0x00000000
            description: Build parameter MAX_LANES (reads parameter; counted as 0 in reset value).
          - name: ACTIVE_LANES_APPLIED
            bit_offset: 10
            bit_width: 2
            access: ro
            reset: 0x00000000
            description: Lane count in use inside the datapath (read-back).
          - name: VC_EXPOSURE_MAP
            bit_offset: 12
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: '0: VC0=Long, VC1=Short; 1: swapped. Applied to TID and lead channel.'
      - name: PHY_CONFIG
        offset: 0x0000000C
        size: 32
        access: mixed
        reset: 0x00000078
        description: D-PHY configuration.
        fields:
          - name: PHY_ENABLE
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: D-PHY enable; when 0, cl_enable and all dl_enable outputs are deasserted.
          - name: DPHY_RST_REQ
            bit_offset: 1
            bit_width: 1
            access: wo
            reset: 0x00000000
            description: Self-clearing. Starts PHY Reset Sequencer (phy_core_rst >= 40 core_clk).
          - name: CL_ENABLE
            bit_offset: 2
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Clock-lane enable.
          - name: DL_ENABLE
            bit_offset: 3
            bit_width: 4
            access: rw
            reset: 0x0000000F
            description: Data-lane enables, bit 3 = lane 0 .. bit 6 = lane 3.
          - name: FORCERXMODE
            bit_offset: 7
            bit_width: 4
            access: rw
            reset: 0x00000000
            description: Per-lane force-receive-mode, debug/bring-up only.
      - name: METADATA_DT_CONFIG
        offset: 0x00000010
        size: 32
        access: rw
        reset: 0x00000012
        description: Metadata Data Type configuration.
        fields:
          - name: METADATA_DT
            bit_offset: 0
            bit_width: 6
            access: rw
            reset: 0x00000012
            description: Data Type routed to embedded-data path. Must not be 0x10/0x11/0x2B/0x2C.
          - name: METADATA_CAPTURE_EN
            bit_offset: 8
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Enable embedded-data routing/capture.
          - name: FNUM_CHECK_EN
            bit_offset: 9
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Enable frame-number sequence check.
          - name: EMB_EXTRACT_EN
            bit_offset: 10
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Enable embedded-data field extractor.
      - name: STREAM_CONFIG
        offset: 0x00000014
        size: 32
        access: rw
        reset: 0x00000001
        description: Stream output configuration.
        fields:
          - name: AXIS_ENABLE
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000001
            description: Enable AXI4-Stream path towards the ISP.
          - name: STREAM_FORMAT
            bit_offset: 1
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 0 = packed RAW10/RAW12 (bypass), 1 = RAW16. Change only while AXIS_ENABLE = 0.
          - name: STREAM_FOLLOW_DMA_DROP
            bit_offset: 2
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: '1: a capture dropped by DMA alone is also skipped on the stream path.'
      - name: EXPECTED_RESOLUTION
        offset: 0x00000018
        size: 32
        access: rw
        reset: 0x00000000
        description: Expected resolution, reference of the resolution check.
        fields:
          - name: EXPECTED_WIDTH
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00000000
            description: Expected active width (pixels).
          - name: EXPECTED_HEIGHT
            bit_offset: 16
            bit_width: 16
            access: rw
            reset: 0x00000000
            description: Expected active height (lines).
      - name: CORE_STATUS
        offset: 0x00000020
        size: 32
        access: ro
        reset: 0x00000000
        description: Core status.
        fields:
          - name: RESET_IN_PROGRESS
            bit_offset: 0
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: PHY Reset Sequencer running or SOFT_RESET set.
          - name: LINE_BUFFER_FULL
            bit_offset: 1
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Line Buffer fill >= FULL_WATERMARK (raw level).
          - name: SP_FIFO_NOT_EMPTY
            bit_offset: 2
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Generic Short Packet FIFO not empty.
          - name: SP_FIFO_FULL
            bit_offset: 3
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Generic Short Packet FIFO full.
          - name: NULL_BLANK_SEEN
            bit_offset: 4
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'Sticky: Null/Blanking long packet dropped.'
          - name: ACTIVE_SRC
            bit_offset: 5
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 0 = sensor path, 1 = TPG.
          - name: SRC_SWITCH_PENDING
            bit_offset: 6
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Source switch in progress.
          - name: DT_CONFLICT
            bit_offset: 7
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'Sticky: METADATA_DT programmed to a fixed-meaning Data Type.'
          - name: VC_UNSUPPORTED_SEEN
            bit_offset: 12
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'Sticky: packet on unsupported Virtual Channel dropped.'
      - name: PHY_STATUS
        offset: 0x00000024
        size: 32
        access: ro
        reset: 0x00000000
        description: D-PHY clock lane status.
        fields:
          - name: CL_STOPSTATE
            bit_offset: 0
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Clock lane in Stop State.
          - name: CL_ULPS
            bit_offset: 1
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Clock lane in ULPS (inverse of cl_ulpsactivenot).
          - name: CL_RXCLKACTIVEHS
            bit_offset: 2
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: HS clock active (rxbyteclkhs running).
          - name: CL_ULPSCLKNOT
            bit_offset: 3
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Clock lane ULPS line indication (reads 1 in ULPS).
          - name: INIT_DONE
            bit_offset: 4
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: D-PHY initialisation done (observability only).
      - name: LANE_STATUS
        offset: 0x00000028
        size: 32
        access: ro
        reset: 0x00000000
        description: 'Per-lane status, lane x at bits [8x+3:8x]. SOT errors sticky, cleared by SOFT_RESET.'
        fields:
          - name: LANE0_STOPSTATE
            bit_offset: 0
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Lane 0 in Stop State.
          - name: LANE0_SOT_ERROR
            bit_offset: 1
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Lane 0 errsoths seen (sticky).
          - name: LANE0_SOT_SYNC_ERROR
            bit_offset: 2
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Lane 0 errsotsynchs seen (sticky).
          - name: LANE0_SKEWCALHS
            bit_offset: 3
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Lane 0 receiving deskew calibration.
          - name: LANE1_STOPSTATE
            bit_offset: 8
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Lane 1 in Stop State.
          - name: LANE1_SOT_ERROR
            bit_offset: 9
            bit_width: 1
            access: ro
            reset: 0x00000000
