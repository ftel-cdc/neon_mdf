# FX1 trên VP_FX1_V3.0 — không phải bản mô tả đầy đủ silicon.
# CPU/platform: fx1/sw/bootloader/sources/VP_FX1_V3.0/include/fx1/fx1_memory_map.h
# và vp/doc/VP_FX1_V3.0/MEMORY_MAP.md. Startup/linker tái dùng BSP này.
# ISP: nhập đầy đủ từ CSR v1.07, kiểm tra độc lập với các header regmap-v1.07-*.h.
# max_freq_hz = 0: chưa biết CPU clock; tick lấy mtime_hz, KHÔNG lấy CPU clock.
# reset: null = chưa được nguồn xác nhận; KHÔNG được hiểu thành reset bằng 0.
# access: unknown = nguồn chưa xác nhận quyền; không dùng để viết driver tự động.
# W1C/W1S/W1P/W1SC giữ nguyên ngữ nghĩa từ CSR; Mixed phải xét từng field.
# registers: [] = chưa mô tả register hoặc IP reserved; xem description từng IP.
# Không tự thêm GPIO/clock/reset/flash/timer MCU khi tài liệu FX1 chưa cung cấp.
device: FX1
vendor: FTEL
family: FX1
arch: riscv-rv32imafc_zicsr_zifencei
description: FX1 RISC-V trên VP_FX1_V3.0; ISP CSR v1.07. Map VP, chưa xác nhận map silicon.
cpu:
  core: riscv-rv32imafc
  revision: unknown
  max_freq_hz: 0
  isa: rv32imafc_zicsr_zifencei
  abi: ilp32f
  mtvec_mode: direct
  interrupt_controller: plic
  hart_count: 2
  num_irq: 10
  mtime_hz: 20000000
  bsp_provider: fx1-vp
memory:
  - name: BOOTROM
    kind: rom
    address: 0x00000000
    size: 0x00200000
  - name: SRAM
    kind: ram
    address: 0x01000000
    size: 0x00100000
  - name: DDR
    kind: ram
    address: 0x80000000
    size: 0x20000000
peripherals:
# BEGIN ISP: sinh bởi tools/import_fx1_isp.py; sửa nguồn CSR rồi nhập lại.
# FX1 header: fx1_isp_csr.h; SHA256 b512b8e3f01182cf03208748196135be7bcbec413af51f629f2e63509bf29796
  - name: ISP
    base: 0x11000000
    description: ISP FX1 CSR v1.07 + VP extension 0x20261109 (ISP-UPD-001/002/007); FX1 header is authoritative.
    registers:
      - name: COMMON_VER_DATE
        offset: 0x00000000
        size: 32
        access: ro
        reset: 0x18102026
        description: Fixed register-map revision date, BCD; not a build timestamp.
        fields:
          - name: YEAR
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00002026
            description: 'Version Date - Year

              Year, BCD.  Reads 0x2026 for the current map.'
          - name: MONTH
            bit_offset: 16
            bit_width: 8
            access: ro
            reset: 0x00000010
            description: 'Version Date - Month

              Month, BCD.'
          - name: DAY
            bit_offset: 24
            bit_width: 8
            access: ro
            reset: 0x00000018
            description: 'Version Date - Day

              Day of month, BCD.'
      - name: COMMON_VER_ID
        offset: 0x00000004
        size: 32
        access: ro
        reset: 0x00010007
        description: Pipeline programming ABI revision 1.07. Bayer RAW12 statistics, preset-only scaling, channel
          crop and wide CSC range arithmetic.
        fields:
          - name: VERSION
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00010007
            description: Pipeline ABI 0x00010007; no per-block revision registers.
      - name: COMMON_CTRL
        offset: 0x00000008
        size: 32
        access: mixed
        reset: 0x00000000
        description: 'COMMON: global pipeline control. ISP_EN enables pipeline operation; supported optional blocks
          also use their own enable controls.'
        fields:
          - name: ISP_EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'ISP Pipeline Enable

              1 enables pipeline operation. Configure geometry and tuning first, then enable the pipeline before arming/enabling
              DMA so derived output geometry is valid.'
          - name: SOFT_RST
            bit_offset: 1
            bit_width: 1
            access: w1sc
            reset: 0x00000000
            description: 'Request group recovery: stop admission, drain bus/internal work, then 15-clock reset pulse.
              Poll COMMON_RECOVERY_STATUS.BUSY/DONE for completion; copy abort records before restart. Busy requests
              rejected with TUNE_ERROR.PENDING.'
          - name: FRAME_START
            bit_offset: 2
            bit_width: 1
            access: w1s
            reset: 0x00000000
            description: 'Software Frame Trigger (compatibility)

              Retained for register compatibility only. A write of 1 is accepted, self-clears and has no effect on
              the input DMA, admission or any other state. The input DMA starts a frame whenever its head buffer is
              valid; mark exactly one input buffer valid for single-shot operation.'
      - name: COMMON_STATUS
        offset: 0x0000000C
        size: 32
        access: ro
        reset: 0x00000000
        description: 'COMMON: global pipeline status, read-only.'
        fields:
          - name: BUSY
            bit_offset: 0
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'Pipeline Busy

              1 = a frame is in flight somewhere in the pipeline.'
          - name: FRAME_DONE
            bit_offset: 1
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'Frame Complete

              1 = the most recently admitted frame has retired on every enabled output, successfully or by recovery.
              Clears at the next accepted ingress SOF and on reset.'
          - name: ERROR
            bit_offset: 2
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'Error Present

              Live OR of DMA_ERR ALIGN/AXI_RD/AXI_WR, LSC_ERROR, EE_STATUS.ERROR and TUNE_ERROR; flow-control and
              statistics-drop conditions are excluded. See those registers for the cause.'
      - name: COMMON_IRQ_STATUS
        offset: 0x00000010
        size: 32
        access: w1c
        reset: 0x00000000
        description: 'COMMON: interrupt status.  Sticky; write 1 to clear a bit.

          A bit sets regardless of the corresponding COMMON_IRQ_EN mask -- the mask gates the interrupt output, not
          the status.'
        fields:
          - name: FRAME_DONE_IRQ
            bit_offset: 0
            bit_width: 1
            access: w1c
            reset: 0x00000000
            description: 'Frame-Done Interrupt Status

              Set when COMMON_STATUS.FRAME_DONE rises.  Write 1 to clear.'
          - name: ERROR_IRQ
            bit_offset: 1
            bit_width: 1
            access: w1c
            reset: 0x00000000
            description: 'Error Interrupt Status

              Set when DMA_ERR ALIGN, AXI_RD or AXI_WR, any LSC_ERROR bit, EE_STATUS.ERROR or any TUNE_ERROR bit changes
              from 0 to 1, and on every accepted recovery of any cause. IDMA_UNDERRUN, ODMA_OVERFLOW and statistics
              drops do not set it.  Write 1 to clear.'
          - name: STATS_READY_IRQ
            bit_offset: 2
            bit_width: 1
            access: w1c
            reset: 0x00000000
            description: 'Statistics-Ready Interrupt Status

              Set when a statistics block publishes a completed frame.  Write 1 to clear.'
      - name: COMMON_IRQ_EN
        offset: 0x00000014
        size: 32
        access: rw
        reset: 0x00000000
        description: 'COMMON: interrupt enable mask.

          Each bit gates whether the matching COMMON_IRQ_STATUS bit drives the interrupt output; the status bit sets
          either way.'
        fields:
          - name: FRAME_DONE_EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Frame-Done Interrupt Enable

              1 = frame-done contributes to the interrupt output.'
          - name: ERROR_EN
            bit_offset: 1
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Error Interrupt Enable

              1 = error contributes to the interrupt output.'
          - name: STATS_READY_EN
            bit_offset: 2
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Statistics-Ready Interrupt Enable

              1 = statistics-ready contributes to the interrupt output.'
      - name: COMMON_FRAME_WIDTH
        offset: 0x00000018
        size: 32
        access: rw
        reset: 0x00000780
        description: 'COMMON: input frame width before Bayer phase alignment. The Input Formatter may discard one
          leading column, then rounds the remaining width down to even. Program legal DMA geometry. Input-domain changes
          require stopped/drained legacy mode; reject in profile mode with MODE, preserve state. Accepted changes
          invalidate dependent LSC/EE residents and output geometry.'
        fields:
          - name: H_ACTIVE
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00000780
            description: 'External Samples Per Line

              Even external input width before Bayer phase trim, 32..3842. Active W=(Win-SH)&~1 must be 32..3840.
              IDMA reads the external width; downstream coordinates use the derived active width.'
      - name: COMMON_FRAME_HEIGHT
        offset: 0x0000001C
        size: 32
        access: rw
        reset: 0x00000438
        description: 'COMMON: input frame height before Bayer phase alignment. The Input Formatter may discard one
          leading row, then rounds the remaining height down to even. Input DMA requires an even input height. Input-domain
          changes require stopped/drained legacy mode; reject in profile mode with MODE, preserve state. Accepted
          changes invalidate dependent LSC/EE residents and output geometry.'
        fields:
          - name: V_ACTIVE
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00000438
            description: 'External Lines Per Frame

              Even external input height before Bayer phase trim, 32..2162. Active H=(Hin-SV)&~1 must be 32..2160.
              IDMA reads the external height; downstream coordinates use the derived active height.'
      - name: COMMON_BAYER
        offset: 0x00000020
        size: 32
        access: rw
        reset: 0x00000000
        description: 'COMMON: Bayer phase of the incoming raw image. The Input Formatter aligns to RGGB by optional
          leading-column/row removal, then rounds each remaining dimension down to even. Input-domain changes require
          stopped/drained legacy mode; reject in profile mode with MODE, preserve state. Accepted changes invalidate
          dependent LSC/EE residents and output geometry.'
        fields:
          - name: PATTERN
            bit_offset: 0
            bit_width: 2
            access: rw
            reset: 0x00000000
            description: 'Bayer Colour-Filter Pattern

              Bits [1:0] = [vertical shift, horizontal shift].

              0x0 = RGGB

              0x1 = GRBG

              0x2 = GBRG

              0x3 = BGGR'
      - name: COMMON_SCRATCH
        offset: 0x00000028
        size: 32
        access: rw
        reset: 0x00000000
        description: 'COMMON: scratch register, no hardware effect.

          A plain 32-bit RW location, useful for proving the register bus is alive before trusting anything else read
          from it.'
        fields:
          - name: SCRATCH
            bit_offset: 0
            bit_width: 32
            access: rw
            reset: 0x00000000
            description: 'Scratch Value

              Reads back whatever was written.'
      - name: BLC_CTRL
        offset: 0x00000200
        size: 32
        access: rw
        reset: 0x00000000
        description: 'BLC: black level correction control.

          Subtracts the sensor''s dark pedestal, then optionally rescales the remaining range so that full scale is
          restored.'
        fields:
          - name: EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Black Level Correction Enable

              1 = subtract the pedestal, 0 = pass through unchanged.'
      - name: BLC_GAIN_SEL
        offset: 0x00000204
        size: 32
        access: rw
        reset: 0x00000100
        description: Select BLC profile G0..G7 (ISP-UPD-002). Apply per-channel scale of selected BLC profile; 0 selects
          unity.
        fields:
          - name: GAIN_LEVEL
            bit_offset: 0
            bit_width: 3
            access: rw
            reset: 0x00000000
            description: Select BLC profile G0..G7 (ISP-UPD-002).
          - name: RANGE_SCALE_EN
            bit_offset: 8
            bit_width: 1
            access: rw
            reset: 0x00000001
            description: Apply per-channel scale of selected BLC profile; 0 selects unity.
      - name: BLC_OFS_G0_DFT
        offset: 0x00000208
        size: 32
        access: rw
        reset: 0x000000C8
        description: 'BLC: profile G0 shared pedestal.

          Subtracted from every channel; the per-channel registers add a trim on top.'
        fields:
          - name: OFS_G0_DFT
            bit_offset: 0
            bit_width: 12
            access: rw
            reset: 0x000000C8
            description: 'Profile G0 Shared Black Level

              Unsigned 12-bit Bayer code, 0..4095. The shared pedestal and selected channel trim are added exactly
              in 13 bits before subtraction, without wrap or saturation; the residual clamps at zero. Reset 200.'
      - name: BLC_OFS_G0_R
        offset: 0x0000020C
        size: 32
        access: rw
        reset: 0x00000000
        description: 'BLC: profile G0 red trim.'
        fields:
          - name: OFS_G0_R
            bit_offset: 0
            bit_width: 12
            access: rw
            reset: 0x00000000
            description: 'Profile G0 Red Black Level Trim

              Unsigned 12-bit Bayer code, 0..4095. The shared pedestal and selected channel trim are added exactly
