        reset: 0x00000000
        description: Gamma status. LUT_LOADED reports confirmed validity of curve bank 0 in both modes; bank-0 writes,
          INIT of bank 0, leaving profile mode, hard reset and profile-mode common soft reset clear it. An unloaded
          table bypasses correction.
        fields:
          - name: BUSY
            bit_offset: 0
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'The Gamma Block Busy

              1 while the block holds in-flight pixels. Follow the block-specific configuration and LUT loading sequence;
              busy alone does not grant permission to rewrite live tables.'
          - name: LUT_LOADED
            bit_offset: 1
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Software-confirmed validity of curve bank 0 in both modes; legacy confirmation and profile-mode
              GAMMA_CONFIRM of bank 0 set it. INIT of bank 0 and leaving profile mode also clear it. Hard reset and
              profile-mode common soft reset clear it; legacy common soft reset preserves it. Verify the complete
              curve before confirmation. An unloaded table bypasses Gamma.
      - name: CSC_CTRL
        offset: 0x00001400
        size: 32
        access: rw
        reset: 0x00000000
        description: 'CSC: RGB to YCbCr conversion, no bypass. STD selects BT.601 or BT.709; TUNE_CSC_CTRL.FULL_RANGE
          selects range independently, default full range. Optional look controls and wide intermediate arithmetic
          follow the frame profile.'
        fields:
          - name: STD
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Colour Standard Select

              0 BT.601 (reset), 1 BT.709. Held for the frame. Range is independently selected by TUNE_CSC_CTRL.FULL_RANGE,
              default full range. No bypass. CH2 inverse CSC uses matching frame-held standard and range.'
      - name: GTM_CTRL
        offset: 0x00001600
        size: 32
        access: rw
        reset: 0x00000000
        description: 'GTM: automatic tone adaptation from a completed prior frame or a protected manual curve. Automatic
          updates are at least one frame delayed and may wait for curve completion and ownership; manual mode holds
          the software-selected curve.'
        fields:
          - name: EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Tone Mapping Enable

              1 = apply the tone curve, 0 = pass through unchanged.'
          - name: MANUAL
            bit_offset: 1
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Manual Curve Hold

              1 holds automatic curve construction. Load the software curve with EN=0 and MANUAL=1, verify it, then
              enable. MANUAL does not permit memory writes while EN=1. Legacy mode applies manual bank 0 only when
              all 65 points are complete; otherwise samples pass through.'
      - name: GTM_LUT_ADDR
        offset: 0x00001604
        size: 32
        access: rw
        reset: 0x00000000
        description: 'GTM: ratio LUT index.

          Auto-increments on every write to GTM_LUT_DATA.'
        fields:
          - name: ADDR
            bit_offset: 0
            bit_width: 7
            access: rw
            reset: 0x00000000
            description: 'Tone Curve Index

              Control point 0..64.  The table is 65 entries, not 64: sixty-four interpolation intervals plus the endpoint,
              which is why the field is 7 bits. Point i covers luma 4*i. Data writes at 65..127 are discarded and
              read back zero.'
      - name: GTM_LUT_DATA
        offset: 0x00001608
        size: 32
        access: rw
        reset: 0x00000000
        description: 'GTM: ratio LUT write port. Memory updates only while GTM_CTRL.EN=0; enabled writes do not update
          the table. MANUAL=1 holds automatic construction during loading and use.'
        fields:
          - name: DATA
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00000000
            description: 'Tone Curve Write Data

              UQ8.8 ratio applied to that luma level; 256 = unity, below darkens, above brightens.  Reading returns
              the shadow, not the table -- use GTM_LUT_RDATA.'
      - name: GTM_KEY
        offset: 0x0000160C
        size: 32
        access: rw
        reset: 0x0000002E
        description: 'GTM: photographic key scales scene-referred luminance for automatic tone-curve construction;
          it does not guarantee the output arithmetic mean.'
        fields:
          - name: KEY
            bit_offset: 0
            bit_width: 8
            access: rw
            reset: 0x0000002E
            description: 'Photographic Key

              UQ0.8 photographic key. Reset 0x2E = 46/256 = 0.1796875, approximately 0.18. This is the automatic curve
              exposure parameter, not a guaranteed output mean.'
      - name: GTM_LWHITE
        offset: 0x00001610
        size: 32
        access: rw
        reset: 0x00000400
        description: 'GTM: the luminance that maps to white.

          Everything above this is compressed to full scale.  The hardware forms the reciprocal itself.'
        fields:
          - name: LWHITE
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00000400
            description: 'White Point Luminance

              UQ8.8 relative to the scene average; reset 0x0400 = 4.0.'
      - name: GTM_ROI_LOG2
        offset: 0x00001614
        size: 32
        access: rw
        reset: 0x0000000B
        description: 'GTM: centered metering window with nominal edge 2^n. Each axis independently clamps its exponent
          to floor(log2(active extent)), so the effective window may be rectangular. Power-of-two area permits shift
          normalization.'
        fields:
          - name: ROI_LOG2
            bit_offset: 0
            bit_width: 5
            access: rw
            reset: 0x0000000B
            description: 'Metering Window Size (log2)

              Nominal edge 2^n, independently clamped to powers of two fitting the input width and height. Reset 11.
              Statistics are measured on input luma and the resulting automatic curve is used on a later frame.'
      - name: GTM_LUT_RDATA
        offset: 0x00001618
        size: 32
        access: ro
        reset: 0x00000000
        description: 'GTM: ratio LUT read-back at GTM_LUT_ADDR, read-only.'
        fields:
          - name: RDATA
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
            description: 'Tone Curve Read Data

              Profile mode: the TUNE_BANK-selected bank manual curve at GTM_LUT_ADDR; entries without both byte lanes
              written read zero; automatic curves are not readable. Legacy mode: manual bank 0 when MANUAL=1 (incomplete
              entries read zero), the most recently published automatic curve when MANUAL=0.'
      - name: GTM_STATUS
        offset: 0x0000161C
        size: 32
        access: ro
        reset: 0x00000000
        description: 'GTM: block status.'
        fields:
          - name: BUSY
            bit_offset: 0
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'The Tone-Mapping Block Busy

              1 while the block holds in-flight pixels. Follow the block-specific configuration and LUT loading sequence;
              busy alone does not grant permission to rewrite live tables.'
      - name: NR_2D_CTRL
        offset: 0x00001800
        size: 32
        access: rw
        reset: 0x00000000
        description: 'NR_2D: spatial noise reduction control.

          A Haar-wavelet denoise whose strength follows a noise variance measured on the previous frame.'
        fields:
          - name: EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: '2D Noise Reduction Enable

              1 = filter, 0 = pass through unchanged.

              This block routes the stream around the engine when disabled, so the change is held until the engine
              has drained rather than applied mid-frame.'
      - name: NR_2D_EST_VAR
        offset: 0x00001804
        size: 32
        access: ro
        reset: 0x00000000
        description: 'NR_2D: read-only automatic noise-variance estimate from a completed frame. Automatic mode consumes
          an eligible prior estimate; manual and luma-LUT modes select their configured variance instead.'
        fields:
          - name: EST_VAR
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
            description: 'Measured Noise Variance

              NR_EST_VAR: unsigned 16-bit integer variance, saturated to 65535; reset zero. Internal sigma is unsigned
              UQ9.8 (17 bits) before squaring and shifting. This readback is the automatic estimate, independent of
              the selected variance mode.'
      - name: NR_2D_STATUS
        offset: 0x00001808
        size: 32
        access: ro
        reset: 0x00000000
        description: 'NR: block status.'
        fields:
          - name: BUSY
            bit_offset: 0
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: 'The 2D Noise-Reduction Block Busy

              1 while the block holds in-flight pixels. Follow the block-specific configuration and LUT loading sequence;
              busy alone does not grant permission to rewrite live tables.'
      - name: TNR_3D_CTRL
        offset: 0x00001A00
        size: 32
        access: rw
        reset: 0x00000000
        description: 'TNR_3D: reserved for a future temporal noise-reduction function. Register storage is present;
          writes have no image-processing effect in this MAS.'
        fields:
          - name: EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Temporal NR Enable (not implemented)

              Reserved; no processing effect in this MAS.'
      - name: TNR_3D_MTF_SEL
        offset: 0x00001A04
        size: 32
        access: rw
        reset: 0x00000000
        description: 'TNR_3D: motion transfer function preset.

          NOT IMPLEMENTED -- see TNR_3D_CTRL.'
        fields:
          - name: MTF
            bit_offset: 0
            bit_width: 3
            access: rw
            reset: 0x00000000
            description: 'Motion Transfer Preset (not implemented)

              Reserved; no processing effect in this MAS.

              0 = none, 1 = weak, 2 = medium, 3 = strong, 4 = aggressive.'
      - name: TNR_3D_HIST_BASE
        offset: 0x00001A08
        size: 32
        access: rw
        reset: 0x00000000
        description: 'TNR_3D: DDR base address of the history frame.

          NOT IMPLEMENTED -- see TNR_3D_CTRL.'
        fields:
          - name: HIST_BASE_ADDR
            bit_offset: 0
            bit_width: 32
            access: rw
            reset: 0x00000000
            description: 'History Frame Base Address (not implemented)

              Reserved; no processing effect in this MAS.'
      - name: EE_CTRL
        offset: 0x00001C00
        size: 32
        access: rw
        reset: 0x00000000
        description: 'EE: edge enhancement control.

          Sharpens by adding back a clamped, gain-shaped high-pass of the luma at two scales.'
        fields:
          - name: EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Edge Enhancement Enable

              1 = sharpen, 0 = delayed pass-through (the latency is unchanged).'
          - name: REG_UPDATE
            bit_offset: 1
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Reserved Update Control

              Readable/writable compatibility field; no explicit commit command. Enable, selected profile and scalar
              configuration are captured at the accepted window-centre SOF. In profile mode, the ingress token supplies
              the bank enable and resident selection; local SOF uses that captured token.'
          - name: PROFILE_SEL
            bit_offset: 2
            bit_width: 2
            access: rw
            reset: 0x00000000
            description: 'Active Parameter Profile Select

              0..2 select one of three resident tuning profiles. Captured at accepted window-centre SOF. Code 3 selects
              profile 0. Separate from PROFILE_WR_SEL. In profile mode, the ingress token supplies the bank enable
              and resident selection; local SOF uses that captured token.'
          - name: PROFILE_WR_SEL
            bit_offset: 4
            bit_width: 2
            access: rw
            reset: 0x00000000
            description: Live resident programming/readback selector 0..2. Code 3 discards writes and reads profile
              0. Not banked by TUNE_BANK.
      - name: EE_ALPHA
        offset: 0x00001C04
        size: 32
        access: rw
        reset: 0x00004000
        description: 'EE: fine-scale (3x3) sharpening strength. Resident scalar: PROFILE_WR_SEL selects both read
          and write; outside TUNE_BANK. Writes clear confirmation and are blocked while active, sealed, pending or
          referenced in profile mode.'
        fields:
          - name: ALPHA
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00004000
            description: 'Fine-Scale Sharpening Strength

              UQ1.15; 0x8000 = 1.0 and is the maximum.

              Larger values are clamped to 1.0 by the hardware rather than wrapping.'
      - name: EE_BETA
        offset: 0x00001C08
        size: 32
        access: rw
        reset: 0x00002000
        description: 'EE: coarse-scale (5x5) sharpening strength. Resident scalar: PROFILE_WR_SEL selects both read
          and write; outside TUNE_BANK. Writes clear confirmation and are blocked while active, sealed, pending or
          referenced in profile mode.'
        fields:
          - name: BETA
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00002000
            description: 'Coarse-Scale Sharpening Strength

              UQ1.15; 0x8000 = 1.0 and is the maximum, clamped as ALPHA is. The coarse term broadens the halo; usually
              set below ALPHA.'
      - name: EE_CLAMP
        offset: 0x00001C0C
        size: 32
        access: rw
        reset: 0x00001810
        description: 'EE: limits on how far one pixel may be moved.

          The asymmetry is deliberate -- overshoot on the bright side of an edge is more visible than undershoot,
          so the positive clamp is usually the smaller. Resident scalar: PROFILE_WR_SEL selects both read and write;
          outside TUNE_BANK. Writes clear confirmation and are blocked while active, sealed, pending or referenced
          in profile mode.'
        fields:
          - name: CLAMP_POS
            bit_offset: 0
            bit_width: 8
            access: rw
            reset: 0x00000010
            description: 'Positive Correction Limit

              Largest positive correction, in 8-bit luma counts.'
          - name: CLAMP_NEG
            bit_offset: 8
            bit_width: 8
            access: rw
            reset: 0x00000018
            description: 'Negative Correction Limit

              Largest negative correction, in 8-bit luma counts.'
      - name: EE_FEATURE_EN
        offset: 0x00001C10
        size: 32
        access: rw
        reset: 0x00000000
        description: 'EE: optional activity, contrast and radial gain modulation. With all three disabled, correction
          still uses ALPHA/BETA and the always-applied luma LUT; disabled optional modulations contribute unity. Resident
          scalar: PROFILE_WR_SEL selects both read and write; outside TUNE_BANK. Writes clear confirmation and are
          blocked while active, sealed, pending or referenced in profile mode.'
        fields:
          - name: ACTIVITY_EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Activity Modulation Enable

              1 = modulate by local activity, from the ACT LUT.

              Suppresses sharpening in flat areas, where it would only amplify noise.'
          - name: CONTRAST_EN
            bit_offset: 1
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Contrast Modulation Enable

              1 = modulate by local contrast, from the CPOS and CNEG LUTs. Separate tables for positive and negative
              excursions.'
          - name: RADIAL_EN
            bit_offset: 2
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Radial Modulation Enable

              1 = modulate by distance from the image centre, using the R2 thresholds and the four radial gains.  Lets
              the corners be sharpened differently from the centre.'
      - name: EE_RADIAL_CENTER
        offset: 0x00001C14
        size: 32
        access: rw
        reset: 0x00000000
        description: 'EE: centre of the radial falloff.

          Held at twice the coordinate so the centre can sit on a half-pixel, which matters for an even-sized frame
          whose true centre is between pixels. Resident scalar: PROFILE_WR_SEL selects both read and write; outside
          TUNE_BANK. Writes clear confirmation and are blocked while active, sealed, pending or referenced in profile
          mode.'
        fields:
          - name: CENTER_X2
            bit_offset: 0
            bit_width: 13
            access: rw
            reset: 0x00000000
            description: 'Radial Centre Column (x2)

              Twice the centre column.  For a 1920-wide frame the centre is 1919/2, so this is 1919.'
          - name: CENTER_Y2
            bit_offset: 16
            bit_width: 13
            access: rw
            reset: 0x00000000
            description: 'Radial Centre Row (x2)

              Twice the centre row.'
      - name: EE_RADIAL_R2_TH0
        offset: 0x00001C18
        size: 32
        access: rw
        reset: 0x00000000
        description: 'EE: radial zone boundary 0.

          Squared distance, so no square root is needed in the datapath. Resident scalar: PROFILE_WR_SEL selects both
          read and write; outside TUNE_BANK. Writes clear confirmation and are blocked while active, sealed, pending
          or referenced in profile mode.'
        fields:
          - name: R2_TH0
            bit_offset: 0
            bit_width: 27
            access: rw
            reset: 0x00000000
            description: 'Radial Zone 0 Boundary

              Squared radius at which zone 0 ends, in units of (2*pixel)^2 to match the doubled centre coordinates.'
      - name: EE_RADIAL_R2_TH1
        offset: 0x00001C1C
        size: 32
        access: rw
        reset: 0x00000000
        description: 'EE: radial zone boundary 1.

          Squared distance, so no square root is needed in the datapath. Resident scalar: PROFILE_WR_SEL selects both
          read and write; outside TUNE_BANK. Writes clear confirmation and are blocked while active, sealed, pending
          or referenced in profile mode.'
        fields:
          - name: R2_TH1
            bit_offset: 0
            bit_width: 27
            access: rw
            reset: 0x00000000
            description: 'Radial Zone 1 Boundary

              Squared radius at which zone 1 ends, in units of (2*pixel)^2 to match the doubled centre coordinates.
              Must not be below R2_TH0. Zones are tested in order and the first match wins; in profile mode SEAL rejects
              decreasing thresholds with RADIAL_EN=1 (INVALID).'
      - name: EE_RADIAL_R2_TH2
        offset: 0x00001C20
        size: 32
        access: rw
        reset: 0x00000000
        description: 'EE: radial zone boundary 2.

          Squared distance, so no square root is needed in the datapath. Resident scalar: PROFILE_WR_SEL selects both
          read and write; outside TUNE_BANK. Writes clear confirmation and are blocked while active, sealed, pending
          or referenced in profile mode.'
        fields:
          - name: R2_TH2
            bit_offset: 0
            bit_width: 27
            access: rw
            reset: 0x00000000
            description: 'Radial Zone 2 Boundary

              Squared radius at which zone 2 ends, in units of (2*pixel)^2 to match the doubled centre coordinates.
              Must not be below R2_TH1. Zones are tested in order and the first match wins; in profile mode SEAL rejects
              decreasing thresholds with RADIAL_EN=1 (INVALID).'
      - name: EE_RADIAL_GAIN_01
        offset: 0x00001C24
        size: 32
        access: rw
        reset: 0x80008000
        description: 'EE: radial gains for the innermost two zones. Resident scalar: PROFILE_WR_SEL selects both read
          and write; outside TUNE_BANK. Writes clear confirmation and are blocked while active, sealed, pending or
          referenced in profile mode.'
        fields:
          - name: GAIN0
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00008000
            description: 'Radial Gain, Innermost Zone

              UQ1.15 gain applied inside R2_TH0; 0x8000 = 1.0 = no change.'
          - name: GAIN1
            bit_offset: 16
            bit_width: 16
            access: rw
            reset: 0x00008000
            description: 'Radial Gain, Zone 1

              UQ1.15 gain applied between R2_TH0 and R2_TH1; 0x8000 = 1.0 = no change.'
      - name: EE_RADIAL_GAIN_23
        offset: 0x00001C28
        size: 32
        access: rw
        reset: 0x80008000
        description: 'EE: radial gains for the outer two zones. Resident scalar: PROFILE_WR_SEL selects both read
          and write; outside TUNE_BANK. Writes clear confirmation and are blocked while active, sealed, pending or
          referenced in profile mode.'
        fields:
          - name: GAIN2
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00008000
            description: 'Radial Gain, Zone 2

              UQ1.15 gain applied between R2_TH1 and R2_TH2; 0x8000 = 1.0 = no change.'
          - name: GAIN3
            bit_offset: 16
            bit_width: 16
            access: rw
            reset: 0x00008000
            description: 'Radial Gain, Outermost Zone

              UQ1.15 gain applied beyond R2_TH2; 0x8000 = 1.0 = no change.'
      - name: EE_LUT_CTRL
        offset: 0x00001C2C
        size: 32
        access: mixed
        reset: 0x00000000
        description: 'Live EE table selector and resident confirmation port. Scalar or LUT writes clear destination
          validity. Confirmation requires complete scalars/tables and mode-specific ownership: unreferenced in profile
          mode, disabled/idle in legacy mode.'
        fields:
          - name: LUT_SEL
            bit_offset: 1
            bit_width: 2
            access: rw
            reset: 0x00000000
            description: 'Gain Table Bank Select

              Also selects which bank EE_LUT_RDATA reads.

              0x0 = LUMA (Luma table, 64 entries)

              0x1 = ACTIVITY (Activity table, 64 entries)

              0x2 = CONTRAST_POS (Contrast-positive table, 32 entries)

              0x3 = CONTRAST_NEG (Contrast-negative table, 32 entries)'
          - name: PROFILE_LOAD_CONFIRM
            bit_offset: 8
            bit_width: 1
            access: w1p
            reset: 0x00000000
            description: 'Confirm complete resident scalars and four LUTs. Profile mode: destination unreferenced
              by active/sealed/pending/in-flight state. Legacy: EE disabled/idle. Same-edge scalar/LUT write wins
              and leaves invalid.'
      - name: EE_LUT_ADDR
        offset: 0x00001C30
        size: 32
        access: rw
        reset: 0x00000000
        description: 'EE: gain table index.

          Auto-increments on every write to EE_LUT_WDATA.'
        fields:
          - name: LUT_ADDR
            bit_offset: 0
            bit_width: 6
            access: rw
            reset: 0x00000000
            description: 'Gain Table Index

              Entry index.  0..63 for the luma and activity tables, 0..31 for the two contrast tables, where the top
              bit is ignored.'
      - name: EE_LUT_WDATA
        offset: 0x00001C34
        size: 32
        access: rw
        reset: 0x00000000
        description: 'EE: gain table write port.'
        fields:
          - name: LUT_WDATA
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00000000
            description: 'Gain Table Write Data

              UQ1.15; 0x8000 = 1.0. Each selected profile owns its tables. RAM contents are undefined after reset:
              load every required entry before enabling EE. Values above 1.0 clamp on use. Readback uses EE_LUT_RDATA.'
      - name: EE_STATUS
        offset: 0x00001C38
        size: 32
        access: mixed
        reset: 0x00000000
        description: EE status. LUT_VALID reports confirmed profiles. An invalid selected profile bypasses correction
          without reading undefined SRAM contents.
        fields:
          - name: BUSY
            bit_offset: 0
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Block holds in-flight pixels. Profile mode protects active/sealed/pending/referenced residents;
              another unreferenced resident may be loaded.
          - name: ERROR
            bit_offset: 1
            bit_width: 1
            access: w1c
            reset: 0x00000000
            description: 'Radial Gain Range Error

              Sticky W1C. Sets once per processed frame when EE and radial gain are enabled and an active-profile
              radial gain exceeds 1.5 (0xC000). The gain clamps to 1.5 on use. A simultaneous new event wins over
              clear.'
          - name: LUT_VALID
            bit_offset: 4
            bit_width: 3
            access: ro
            reset: 0x00000000
            description: Confirmed resident scalars and four LUTs for profiles 0..2. Scalar/LUT writes or input-domain
              changes clear destination validity; hard reset and profile-mode common reset clear all. Invalid selected
              profile bypasses enhancement.
          - name: ACTIVE_PROFILE
            bit_offset: 8
            bit_width: 2
            access: ro
            reset: 0x00000000
            description: Resident selection captured for the most recent accepted local EE SOF; does not follow PROFILE_WR_SEL.
              0..2; zero after hard/common reset.
          - name: ACTIVE_VALID
            bit_offset: 10
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: One after a local SOF selected a confirmed resident; zero until then or after its validity
              is cleared. Separate from block busy and enable.
      - name: EE_LUT_RDATA
        offset: 0x00001C3C
        size: 32
        access: ro
        reset: 0x00000000
        description: 'EE: gain table readback selected by PROFILE_WR_SEL, EE_LUT_CTRL.LUT_SEL and EE_LUT_ADDR. Programming
          selector 3 reads profile 0. Contents are undefined until loaded.'
        fields:
          - name: RDATA
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
            description: 'Gain Table Read Data

              Contents of the selected table entry.'
      - name: CNF_CTRL
        offset: 0x00001E00
        size: 32
        access: rw
        reset: 0x00000000
        description: 'CNF: chroma noise filter control.

          A 5x5 filter that averages chroma over neighbours whose luma and chroma are both close enough, so it smooths
          noise without bleeding colour across edges.'
        fields:
          - name: EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Chroma Noise Filter Enable

              1 = filter chroma, 0 = pass through unchanged.'
          - name: UPDATED
            bit_offset: 2
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Reserved Update Control

              Readable/writable compatibility field with no commit effect. Enable and thresholds are sampled at accepted
              SOF.'
      - name: CNF_CHROMA_TH
        offset: 0x00001E04
        size: 32
        access: rw
        reset: 0x00000000
        description: 'CNF: how different a neighbour''s chroma may be and still be averaged in.'
        fields:
          - name: CHROMA_TH
            bit_offset: 0
            bit_width: 9
            access: rw
            reset: 0x00000000
            description: 'Chroma Similarity Threshold

