        reset: 0x00000000
        description: Payload CRC-16 error count, saturating.
        fields:
          - name: CRC_ERROR_COUNT
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00000000
      - name: FRAME_DROP_COUNT
        offset: 0x00000054
        size: 32
        access: ro
        reset: 0x00000000
        description: Dropped capture count, saturating.
        fields:
          - name: FRAME_DROP_COUNT
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00000000
      - name: LANE_ABORT_COUNT
        offset: 0x00000058
        size: 32
        access: ro
        reset: 0x00000000
        description: Bursts discarded by Lane Management, saturating at 0xFFFF.
        fields:
          - name: LANE_ABORT_COUNT
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
      - name: VC0_IMAGE_INFO1
        offset: 0x00000060
        size: 32
        access: ro
        reset: 0x00000000
        description: Geometry of last published frame on VC0.
        fields:
          - name: BYTE_COUNT
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
            description: Payload bytes of one image long packet (last line).
          - name: LINE_COUNT
            bit_offset: 16
            bit_width: 16
            access: ro
            reset: 0x00000000
            description: Image lines of the frame.
      - name: VC0_IMAGE_INFO2
        offset: 0x00000064
        size: 32
        access: ro
        reset: 0x00000000
        description: Data Type and resolution check of last published frame on VC0.
        fields:
          - name: DATA_TYPE
            bit_offset: 0
            bit_width: 6
            access: ro
            reset: 0x00000000
          - name: WIDTH_MISMATCH
            bit_offset: 6
            bit_width: 1
            access: ro
            reset: 0x00000000
          - name: HEIGHT_MISMATCH
            bit_offset: 7
            bit_width: 1
            access: ro
            reset: 0x00000000
      - name: VC1_IMAGE_INFO1
        offset: 0x00000068
        size: 32
        access: ro
        reset: 0x00000000
        description: Geometry of last published frame on VC1.
        fields:
          - name: BYTE_COUNT
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
            description: Payload bytes of one image long packet (last line).
          - name: LINE_COUNT
            bit_offset: 16
            bit_width: 16
            access: ro
            reset: 0x00000000
            description: Image lines of the frame.
      - name: VC1_IMAGE_INFO2
        offset: 0x0000006C
        size: 32
        access: ro
        reset: 0x00000000
        description: Data Type and resolution check of last published frame on VC1.
        fields:
          - name: DATA_TYPE
            bit_offset: 0
            bit_width: 6
            access: ro
            reset: 0x00000000
          - name: WIDTH_MISMATCH
            bit_offset: 6
            bit_width: 1
            access: ro
            reset: 0x00000000
          - name: HEIGHT_MISMATCH
            bit_offset: 7
            bit_width: 1
            access: ro
            reset: 0x00000000
      - name: GENERIC_SHORT_PACKET
        offset: 0x00000070
        size: 32
        access: ro
        reset: 0x00000000
        description: Head of generic short-packet FIFO (DT 0x08..0x0F). Read pops the entry; empty FIFO reads 0.
        fields:
          - name: DATA_TYPE
            bit_offset: 0
            bit_width: 6
            access: ro
            reset: 0x00000000
          - name: VIRTUAL_CHANNEL
            bit_offset: 6
            bit_width: 2
            access: ro
            reset: 0x00000000
          - name: DATA
            bit_offset: 8
            bit_width: 16
            access: ro
            reset: 0x00000000
      - name: EMBEDDED_DATA_INFO_VC0
        offset: 0x00000074
        size: 32
        access: ro
        reset: 0x00000000
        description: Embedded-data accounting, last published frame on VC0.
        fields:
          - name: EMBEDDED_WORD_COUNT_VC0
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
          - name: EMBEDDED_LINE_COUNT_VC0
            bit_offset: 16
            bit_width: 8
            access: ro
            reset: 0x00000000
      - name: EMBEDDED_DATA_INFO_VC1
        offset: 0x00000078
        size: 32
        access: ro
        reset: 0x00000000
        description: Embedded-data accounting, last published frame on VC1.
        fields:
          - name: EMBEDDED_WORD_COUNT_VC1
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
          - name: EMBEDDED_LINE_COUNT_VC1
            bit_offset: 16
            bit_width: 8
            access: ro
            reset: 0x00000000
      - name: METADATA_RECORD_ID
        offset: 0x0000007C
        size: 32
        access: rw
        reset: 0x00000000
        description: Software handle written into the metadata record; sampled when a capture opens.
        fields:
          - name: METADATA_RECORD_ID
            bit_offset: 0
            bit_width: 32
            access: rw
            reset: 0x00000000
      - name: FRAME_ID
        offset: 0x00000080
        size: 32
        access: ro
        reset: 0x00000000
        description: frame_id of the capture held in each ping-pong buffer.
        fields:
          - name: FRAME_ID_BUF0
            bit_offset: 0
            bit_width: 14
            access: ro
            reset: 0x00000000
          - name: FRAME_ID_BUF1
            bit_offset: 16
            bit_width: 14
            access: ro
            reset: 0x00000000
      - name: TIMESTAMP_LO
        offset: 0x00000084
        size: 32
        access: ro
        reset: 0x00000000
        description: 'Timestamp [31:0] of last published capture (ns). Read snapshots HI into a shadow; read LO first.'
        fields:
          - name: TIMESTAMP_LO
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00000000
      - name: TIMESTAMP_HI
        offset: 0x00000088
        size: 32
        access: ro
        reset: 0x00000000
        description: 'Timestamp [63:32], from shadow taken at TIMESTAMP_LO read.'
        fields:
          - name: TIMESTAMP_HI
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00000000
      - name: DMA_CONTROL
        offset: 0x00000090
        size: 32
        access: rw
        reset: 0x00000010
        description: DMA control.
        fields:
          - name: DMA_ENABLE
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Enable DMA path; clearing it aborts buffers in ST_WRITE.
          - name: DMA_START
            bit_offset: 1
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Allow buffer claims; clear first to stop gracefully.
          - name: DMA_ABORT
            bit_offset: 2
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 'Level: no claim, every buffer in ST_WRITE aborted.'
          - name: DMA_FORMAT
            bit_offset: 3
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 0 = packed RAW10/RAW12, 1 = RAW16. Change only while DMA_ENABLE=0 and idle.
          - name: ERR_FRAME_POLICY
            bit_offset: 4
            bit_width: 1
            access: rw
            reset: 0x00000001
            description: Sampled at claim. 0 = aborted buffer returns free; 1 = released SW_OWNED_ERROR.
      - name: DMA_BUFFER0_ADDR
        offset: 0x00000094
        size: 32
        access: rw
        reset: 0x00000000
        description: 'DDR base of ping-pong buffer 0; bits [2:0] ignored.'
        fields:
          - name: DMA_BUFFER0_ADDR
            bit_offset: 0
            bit_width: 32
            access: rw
            reset: 0x00000000
      - name: DMA_BUFFER1_ADDR
        offset: 0x00000098
        size: 32
        access: rw
        reset: 0x00000000
        description: 'DDR base of ping-pong buffer 1; bits [2:0] ignored.'
        fields:
          - name: DMA_BUFFER1_ADDR
            bit_offset: 0
            bit_width: 32
            access: rw
            reset: 0x00000000
      - name: DMA_BUFFER_SIZE
        offset: 0x0000009C
        size: 32
        access: rw
        reset: 0x00000000
        description: Size of the RAW region of one channel; buffer = 2*(this + META_AREA_SIZE).
        fields:
          - name: DMA_BUFFER_SIZE
            bit_offset: 0
            bit_width: 32
            access: rw
            reset: 0x00000000
      - name: DMA_ATTR
        offset: 0x000000A0
        size: 32
        access: mixed
        reset: 0x00000FF0
        description: DMA AXI attributes; sampled at claim.
        fields:
          - name: AWQOS
            bit_offset: 0
            bit_width: 4
            access: rw
            reset: 0x00000000
            description: m_axi4_awqos.
          - name: MAX_BURST_LEN
            bit_offset: 4
            bit_width: 8
            access: rw
            reset: 0x000000FF
            description: AWLEN encoding (beats-1), clamped to MAX_BURST_BEATS-1.
          - name: AWPROT
            bit_offset: 12
            bit_width: 3
            access: rw
            reset: 0x00000000
            description: m_axi4_awprot.
          - name: MAX_OUTSTANDING
            bit_offset: 16
            bit_width: 7
            access: ro
            reset: 0x00000000
            description: Read-back of build parameter MAX_OUTSTANDING (8).
      - name: DMA_STATUS
        offset: 0x000000A4
        size: 32
        access: ro
        reset: 0x00000000
        description: DMA status.
        fields:
          - name: DMA_BUSY
            bit_offset: 0
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Any buffer in WRITE/DRAIN/ABORT.
          - name: ACTIVE_BUFFER
            bit_offset: 1
            bit_width: 1
            access: ro
            reset: 0x00000000
            description: Buffer most recently claimed.
      - name: LINE_PITCH
        offset: 0x000000A8
        size: 32
        access: rw
        reset: 0x00000000
        description: Line pitch in DDR; stride = BYTES_PER_LINE + LINE_PADDING (multiple of 8).
        fields:
          - name: BYTES_PER_LINE
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00000000
          - name: LINE_PADDING
            bit_offset: 16
            bit_width: 8
            access: rw
            reset: 0x00000000
      - name: BUFFER_OWNERSHIP
        offset: 0x000000AC
        size: 32
        access: ro
        reset: 0x00000000
        description: 'Per-buffer ownership: 00 HW_OWNED, 01 SW_OWNED_VALID, 10 SW_OWNED_ERROR.'
        fields:
          - name: BUF0_STATE
            bit_offset: 0
            bit_width: 2
            access: ro
            reset: 0x00000000
          - name: BUF1_STATE
            bit_offset: 2
            bit_width: 2
            access: ro
            reset: 0x00000000
      - name: BUFFER_RELEASE
        offset: 0x000000B0
        size: 32
        access: wo
        reset: 0x00000000
        description: Write 1 to return a software-owned buffer to the DMA.
        fields:
          - name: RELEASE_BUF0
            bit_offset: 0
            bit_width: 1
            access: wo
            reset: 0x00000000
          - name: RELEASE_BUF1
            bit_offset: 1
            bit_width: 1
            access: wo
            reset: 0x00000000
      - name: BUFFER_ERROR_INFO
        offset: 0x000000B4
        size: 32
        access: ro
        reset: 0x00000000
        description: Last line (from 0) written OKAY per buffer; 0xFFFF if none.
        fields:
          - name: BUF0_LAST_VALID_LINE
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
          - name: BUF1_LAST_VALID_LINE
            bit_offset: 16
            bit_width: 16
            access: ro
            reset: 0x00000000
      - name: META_AREA_SIZE
        offset: 0x000000B8
        size: 32
        access: rw
        reset: 0x00000000
        description: Size of one channel's metadata area (>= 0x80 + max embedded payload). MAS v1.4.
        fields:
          - name: META_AREA_SIZE
            bit_offset: 0
            bit_width: 32
            access: rw
            reset: 0x00000000
      - name: TPG_CONTROL
        offset: 0x000000C0
        size: 32
        access: rw
        reset: 0x00000000
        description: Test Pattern Generator control; fields except TPG_ENABLE apply from next frame.
        fields:
          - name: TPG_ENABLE
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Start TPG and select it as video source (TPG Mux).
          - name: PATTERN
            bit_offset: 1
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 0 = vertical bars, 1 = horizontal bars.
          - name: TPG_DUAL_VC_EN
            bit_offset: 2
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Interleave VC0/VC1 lines.
          - name: TPG_PIXEL_FORMAT
            bit_offset: 3
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: 0 = RAW12, 1 = RAW10.
          - name: TPG_CFA_ORDER
            bit_offset: 4
            bit_width: 2
            access: rw
            reset: 0x00000000
            description: 00 RGGB, 01 GRBG, 10 GBRG, 11 BGGR (MAS v1.4).
      - name: ERROR_CAPTURE
        offset: 0x000000C4
        size: 32
        access: ro
        reset: 0x00000000
        description: First protocol error of newest capture with an error; cleared by SOFT_RESET.
        fields:
          - name: FAULT_LINE_NUMBER
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
            description: Lines completed on that channel; 0xFFFF if channel unknown.
          - name: FAULT_FRAME_ID
            bit_offset: 16
            bit_width: 14
            access: ro
            reset: 0x00000000
            description: frame_id of the capture; 0 = nothing captured.
          - name: FAULT_VC
            bit_offset: 30
            bit_width: 2
            access: ro
            reset: 0x00000000
            description: 00 VC0, 01 VC1, 11 unknown.
      - name: AXI_FAULT_TRACE
        offset: 0x000000C8
        size: 32
        access: ro
        reset: 0x00000000
        description: First faulting AXI write since last soft reset.
        fields:
          - name: AWID
            bit_offset: 0
            bit_width: 8
            access: ro
            reset: 0x00000000
          - name: RESP
            bit_offset: 8
            bit_width: 2
            access: ro
            reset: 0x00000000
      - name: AXI_FAULT_ADDR
        offset: 0x000000CC
        size: 32
        access: ro
        reset: 0x00000000
        description: Address of first faulting AXI write since last soft reset.
        fields:
          - name: FAULT_AWADDR
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00000000
      - name: AXI_ERROR_COUNT
        offset: 0x000000D0
        size: 32
        access: ro
        reset: 0x00000000
        description: SLVERR/DECERR write-response counters, saturating.
        fields:
          - name: BRESP_SLVERR_COUNT
            bit_offset: 0
            bit_width: 16
            access: ro
            reset: 0x00000000
          - name: BRESP_DECERR_COUNT
            bit_offset: 16
            bit_width: 16
            access: ro
            reset: 0x00000000
      - name: TPG_RESOLUTION
        offset: 0x000000D4
        size: 32
        access: rw
        reset: 0x00000000
        description: TPG active size; width truncated to multiple of 4, min 8x8.
        fields:
          - name: TPG_WIDTH
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00000000
          - name: TPG_HEIGHT
            bit_offset: 16
            bit_width: 16
            access: rw
            reset: 0x00000000
            description: Lines per Virtual Channel.
      - name: TPG_BLANKING
        offset: 0x000000D8
        size: 32
        access: rw
        reset: 0x00000000
        description: TPG blanking.
        fields:
          - name: TPG_HBLANK
            bit_offset: 0
            bit_width: 16
            access: rw
            reset: 0x00000000
            description: sys_clk cycles after each line.
          - name: TPG_VBLANK
            bit_offset: 16
            bit_width: 16
            access: rw
            reset: 0x00000000
            description: Blank line-times after each frame.
      - name: EMB_EXTRACT_CFG0
        offset: 0x000000E0
        size: 32
        access: rw
        reset: 0x00000000
        description: Extraction slot 0 descriptor.
        fields:
          - name: LEN
            bit_offset: 0
            bit_width: 3
            access: rw
            reset: 0x00000000
            description: Field length in bytes.
          - name: BYTE_OFFSET
            bit_offset: 8
            bit_width: 16
            access: rw
            reset: 0x00000000
          - name: LINE_IDX
            bit_offset: 24
            bit_width: 8
            access: rw
            reset: 0x00000000
            description: Embedded line index.
      - name: EMB_EXTRACT_CFG1
        offset: 0x000000E4
        size: 32
        access: rw
        reset: 0x00000000
        description: Extraction slot 1 descriptor.
        fields:
          - name: LEN
            bit_offset: 0
            bit_width: 3
            access: rw
            reset: 0x00000000
            description: Field length in bytes.
          - name: BYTE_OFFSET
            bit_offset: 8
            bit_width: 16
            access: rw
            reset: 0x00000000
          - name: LINE_IDX
            bit_offset: 24
            bit_width: 8
            access: rw
            reset: 0x00000000
            description: Embedded line index.
      - name: EMB_EXTRACT_VC0_VAL0
        offset: 0x000000E8
        size: 32
        access: ro
        reset: 0x00000000
        description: Field captured by slot 0 on VC0 in last published frame.
        fields:
          - name: VALUE
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00000000
      - name: EMB_EXTRACT_VC0_VAL1
        offset: 0x000000EC
        size: 32
        access: ro
        reset: 0x00000000
        description: Field captured by slot 1 on VC0 in last published frame.
        fields:
          - name: VALUE
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00000000
      - name: EMB_EXTRACT_VC1_VAL0
        offset: 0x000000F0
        size: 32
        access: ro
        reset: 0x00000000
        description: Field captured by slot 0 on VC1 in last published frame.
        fields:
          - name: VALUE
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00000000
      - name: EMB_EXTRACT_VC1_VAL1
        offset: 0x000000F4
        size: 32
        access: ro
        reset: 0x00000000
        description: Field captured by slot 1 on VC1 in last published frame.
        fields:
          - name: VALUE
            bit_offset: 0
            bit_width: 32
            access: ro
            reset: 0x00000000
  - name: DDR3
    base: 0x12000000
    description: Đã mô phỏng, CSR 64 KiB. Register chi tiết nằm ở include/fx1_ddr3/fx1_ddr3_regs.h; chưa nhập vào
      YAML trong mốc ISP.
    registers: []
  - name: DDR_SYSCTRL
    base: 0x12010000
    description: Glue CHỈ VP, CSR 64 KiB. Register chi tiết xem include/fx1/fx1_ddr_sysctrl.h; chưa nhập trong mốc
      ISP.
    registers: []
interrupts:
- number: 1
  name: UART
  description: UART level
- number: 2
  name: SYS_DMA
  description: SYS_DMA combined IRQ
- number: 3
  name: ISP
  description: ISP combined IRQ
- number: 4
  name: NPU
  description: Reserved; SIM_CTRL có thể kích thích trong test VP
- number: 5
  name: H264_H265
  description: Reserved; SIM_CTRL test
- number: 6
  name: ETH
  description: Reserved; SIM_CTRL test
- number: 7
  name: MIPI
  description: MIPI CSI-2 RX csi2_irq (level, IRQ_STATUS & IRQ_ENABLE & GLOBAL_ENABLE); không kích hoạt nếu VP không bật --camera
- number: 8
  name: DDR
  description: DDR3 controller level
- number: 9
  name: I2C0
  description: I2C0 level
