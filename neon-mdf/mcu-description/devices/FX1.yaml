        size: 32
        access: w1p
        reset: 0x00000000
        description: One command per write, except EXACT with APPLY; any other nonzero combination, including EXACT
          alone, executes nothing and sets INVALID. In legacy mode any nonzero write sets only MODE. SEAL validates
          but does not activate. UNSEAL permits edits only when inactive, nonpending and unreferenced. APPLY drains
          the old epoch before activation at an eligible ingress SOF. Check TUNE_STATUS/TUNE_ERROR after each command.
        fields:
          - name: INIT
            bit_offset: 0
            bit_width: 1
            access: w1p
            reset: 0x00000000
            description: Initialize free bank-owned scalars from legacy state and extension defaults; invalidate bank-local
              payload readiness. Does not copy resident EE scalars, shared LSC mesh shape or live loader ports.
          - name: SEAL
            bit_offset: 1
            bit_width: 1
            access: w1p
            reset: 0x00000000
            description: Validate and seal selected bank including required tables.
          - name: APPLY
            bit_offset: 2
            bit_width: 1
            access: w1p
            reset: 0x00000000
            description: Snapshot pre-edge TUNE_BANK, selected bank ID and EXACT target. Pending first eligible next
              edge. Initial profile accepts NEXT or EXACT equal NEXT_FRAME only; farther target INVALID. A rejected
              APPLY changes nothing and sets one bit, first applicable of MODE, PENDING, NOT_READY (bank not sealed),
              INVALID, MISSED.
          - name: CANCEL
            bit_offset: 3
            bit_width: 1
            access: w1p
            reset: 0x00000000
            description: 'Cancel pending request before its ingress acceptance. With no pending request: no effect,
              no error.'
