      - name: CH2_RESIZER_CTRL
        offset: 0x00003400
        size: 32
        access: rw
        reset: 0x00000000
        description: CH2 AI RGB888 output resizer control, maximum output 640x640. Input is the post-IQ crop for this
          channel; the crop may be larger than the output. No upscaling or custom target sizes. Reject invalid targets
          before DMA arm; no silent FullRes fallback. Wait for channel OUT_W/H to settle.
        fields:
          - name: EN
            bit_offset: 0
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: CH2 resizer enable. 1 selects SCALE; 0 bypasses scaling and preserves crop size. Both paths
              must fit the 640x640 output limit. Change geometry only after stop/drain; validate before DMA arm.
          - name: UPDATED
            bit_offset: 2
            bit_width: 1
            access: rw
            reset: 0x00000000
            description: Legacy software update hint; readable storage with no commit effect. Active size, crop, enable
              and SCALE changes trigger geometry derivation. Custom-size words are reserved. Wait for OUT_W/H to settle
              before arming DMA; capture geometry at SOF.
          - name: SCALE
            bit_offset: 3
            bit_width: 5
            access: rw
            reset: 0x00000000
            description: CH2 AI RGB888 preset selector [7:3]. 0=FullRes crop bypass; 8=640x360; 14=640x480; 16=640x640;
              17=640x384; 18=640x352; 19=512x512; 20=416x416; 21=320x320. All other codes invalid on CH2. FullRes
              crop must fit 640x640. Output must not exceed crop dimensions. No upscaling.
